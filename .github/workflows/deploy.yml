
name: CRC Research CD - GitHub Pages

on:
  workflow_run:
    workflows:
      - CRC Research CI Pipeline
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Angular
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular for GitHub Pages
        working-directory: frontend
        run: npm run build -- --base-href /crc-research-cicd/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Angular website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
